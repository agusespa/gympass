# The app has no login of its own. It must only be reachable through a
# Cloudflare Tunnel protected by Cloudflare Access (see README, "Secure
# Hosting"), so it publishes no port: cloudflared reaches it over this
# compose network. Never add a "ports" section to gym-tracker.
services:
  gym-tracker:
    image: ghcr.io/agusespa/gym-tracker:latest
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      DB_PATH: /app/data/gym.db
      PORT: "8080"
      # Optional: POST finished workouts to n8n (see README, "Webhook").
      # WEBHOOK_URL: https://n8n.example.com/webhook/gym-tracker
      # WEBHOOK_SECRET: change-me

  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    command: tunnel run
    environment:
      # From Zero Trust > Networks > Tunnels. In the tunnel's public
      # hostname, point the service at http://gym-tracker:8080.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - gym-tracker
