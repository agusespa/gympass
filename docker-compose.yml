services:
  gym-tracker:
    image: ghcr.io/agusespa/gym-tracker:latest
    restart: unless-stopped
    # Reachable only from this machine (for a cloudflared running on the
    # host), never from the LAN: all other access goes through the tunnel.
    # If cloudflared runs in Docker on the same network, remove "ports".
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      DB_PATH: /app/data/gym.db
      PORT: "8080"
      # Optional: POST finished workouts to n8n (see README, "Webhook").
      # WEBHOOK_URL: https://n8n.example.com/webhook/gym-tracker
      # WEBHOOK_SECRET: change-me
      # Optional: let AI assistants log in to /mcp through Cloudflare Access
      # (see README, "AI assistants").
      # CF_ACCESS_TEAM_DOMAIN: myteam.cloudflareaccess.com
      # CF_ACCESS_AUD: <Application Audience (AUD) Tag>
